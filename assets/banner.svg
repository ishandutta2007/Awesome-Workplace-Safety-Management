<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Vibrant Gradient Filters -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .card-1 { animation: floatCard1 6s ease-in-out infinite; transform-origin: center; }
    .card-2 { animation: floatCard2 7s ease-in-out infinite; transform-origin: center; }
    .pulse-path { stroke-dasharray: 600; animation: pulseLine 4s linear infinite; }
    .radar-beam { transform-origin: 1020px 170px; animation: radarSweep 8s linear infinite; }
  </style>

  <!-- Base Rect -->
  <rect width="1200" height="340" fill="url(#bgGradient)" rx="16"/>
  <rect width="1200" height="340" fill="url(#grid)" rx="16"/>

  <!-- Background Animated Graphics (Right Side) -->
  <g transform="translate(100, 0)">
    <!-- Radar Circle -->
    <circle cx="920" cy="170" r="110" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2"/>
    <circle cx="920" cy="170" r="70" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="920" cy="170" r="30" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    
    <!-- Radar Sweep Beam -->
    <g class="radar-beam">
      <path d="M 1020 170 A 100 100 0 0 0 920 70 L 920 170 Z" fill="url(#pulseGrad)" opacity="0.4"/>
    </g>

    <!-- Floating Metric Cards (Behind Text Layer in Z-Space, Shifted Right) -->
    <g class="card-1">
      <rect x="730" y="50" width="170" height="75" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="750" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SAFETY SCORE</text>
      <text x="750" y="108" fill="#34d399" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">99.4%</text>
      <circle cx="875" cy="88" r="14" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 870 88 L 873 91 L 880 84" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g class="card-2">
      <rect x="800" y="215" width="190" height="75" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="820" y="243" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">INCIDENT RATE (TRIR)</text>
      <text x="820" y="273" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">0.00</text>
      <text x="880" y="273" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">(-100%)</text>
    </g>

    <!-- Connecting Pulse Lines -->
    <path class="pulse-path" d="M 600 170 Q 750 120 920 170 T 1050 220" fill="none" stroke="url(#textGrad)" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Left Side: Title and Subtitle (Ensured Foreground Integrity) -->
  <g transform="translate(70, 0)">
    <!-- Badge -->
    <g transform="translate(0, 55)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#34d399"/>
      <text x="30" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Workplace Safety Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="178" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">
      Curated SaaS Platforms, EHS Software &amp; Open-Source Solutions
    </text>

    <!-- Feature Chips / Tags -->
    <g transform="translate(0, 220)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🛡️  OSHA &amp; EHS</text>

      <!-- Chip 2 -->
      <rect x="162" y="0" width="165" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="176" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">📊 Occupancy AI</text>

      <!-- Chip 3 -->
      <rect x="339" y="0" width="175" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="353" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⚡ Incident &amp; CAPA</text>
    </g>

    <!-- Footer Meta -->
    <text x="0" y="290" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      Maintained by @ishandutta2007 • Updated for 2026 Enterprise &amp; Open-Source Worktech
    </text>
  </g>
</svg>
