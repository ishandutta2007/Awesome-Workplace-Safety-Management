<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="chart-wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .chart-bar {
      transform-origin: bottom;
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse-wave {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    .animated-float {
      animation: float 5s ease-in-out infinite;
    }
    .animated-wave {
      animation: pulse-wave 4s ease-in-out infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" />
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" />
  </g>

  <!-- Background Dynamic Graphic Elements (Behind Title/Text) -->
  <g opacity="0.25" class="animated-wave">
    <!-- Wave fill -->
    <path d="M 600 300 Q 750 200 900 250 T 1200 180 L 1200 360 L 600 360 Z" fill="url(#chart-wave)" />
    <!-- Wave line -->
    <path d="M 600 300 Q 750 200 900 250 T 1200 180" fill="none" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- Right Decorative Analytics Graphic Card (Subtle background graphic) -->
  <g transform="translate(820, 50)" filter="url(#shadow)" class="animated-float">
    <rect width="320" height="260" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Mini Dashboard Header -->
    <rect x="24" y="24" width="100" height="12" rx="6" fill="#38bdf8" opacity="0.8" />
    <rect x="24" y="44" width="160" height="8" rx="4" fill="#64748b" opacity="0.5" />
    
    <!-- Mini Stat Widgets -->
    <rect x="24" y="70" width="80" height="50" rx="8" fill="#0f172a" stroke="#1e293b" />
    <circle cx="44" cy="88" r="8" fill="#3b82f6" />
    <rect x="58" y="84" width="36" height="8" rx="4" fill="#94a3b8" />
    
    <rect x="116" y="70" width="80" height="50" rx="8" fill="#0f172a" stroke="#1e293b" />
    <circle cx="136" cy="88" r="8" fill="#10b981" />
    <rect x="150" y="84" width="36" height="8" rx="4" fill="#94a3b8" />

    <rect x="208" y="70" width="88" height="50" rx="8" fill="#0f172a" stroke="#1e293b" />
    <circle cx="228" cy="88" r="8" fill="#8b5cf6" />
    <rect x="242" y="84" width="42" height="8" rx="4" fill="#94a3b8" />

    <!-- Animated Chart Columns inside Card -->
    <g transform="translate(24, 140)">
      <!-- Chart Baseline -->
      <line x1="0" y1="90" x2="272" y2="90" stroke="#334155" stroke-width="2" />
      
      <!-- Bars -->
      <rect x="15" y="40" width="22" height="50" rx="4" fill="url(#accent-cyan)" />
      <rect x="55" y="20" width="22" height="70" rx="4" fill="url(#accent-purple)" />
      <rect x="95" y="55" width="22" height="35" rx="4" fill="url(#accent-cyan)" />
      <rect x="135" y="10" width="22" height="80" rx="4" fill="url(#accent-purple)" filter="url(#glow)" opacity="0.9" />
      <rect x="175" y="30" width="22" height="60" rx="4" fill="url(#accent-cyan)" />
      <rect x="215" y="45" width="22" height="45" rx="4" fill="url(#accent-purple)" />
    </g>
  </g>

  <!-- Foreground Title and Main Content (Ensured Clear Visibility) -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 65)">
      <rect width="260" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#glow)" />
      <text x="36" y="22" class="badge-text">📊 AWESOME ANALYTICS 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" class="title" filter="url(#shadow)">Visual Data Analytics</text>
    <text x="0" y="205" class="title" fill="url(#accent-cyan)" filter="url(#shadow)">Ecosystem &amp; Platforms</text>

    <!-- Subtitle -->
    <text x="0" y="255" class="subtitle">Curated BI Suites, Self-Hosted Analytics &amp; Open-Source Engines</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 285)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Open-Source BI</text>
      
      <!-- Tag 2 -->
      <rect x="142" y="0" width="145" height="28" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="154" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">📈 Enterprise SaaS</text>

      <!-- Tag 3 -->
      <rect x="299" y="0" width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="311" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔮 AI &amp; SQL Engines</text>
    </g>
  </g>
</svg>
